name: Visual QA
# Builds the app and runs it on a cloud Android emulator: screenshots (light + dark), crash check and a
# 300-tap random stress test. Problems become a `ready` issue for the cloud agent (max 3 per week).
# Every Monday (or on demand) Claude reviews the screenshots against the redesign brief.
on:
  push:
    branches: [main]
    paths: ["app/src/**"]
  schedule:
    - cron: "45 3 * * 1"
  workflow_dispatch:
    inputs:
      review:
        description: "Also run the AI design review"
        type: boolean
        default: true

permissions:
  contents: read
  issues: write
  actions: write
  id-token: write

concurrency:
  group: visual-qa
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      APP_ID: com.sabin.notes
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew assembleDebug --no-daemon
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          script: bash .github/scripts/android-shots.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: screenshots
          path: shots/
      - name: Queue a fix for the agent
        if: hashFiles('problems.md') != ''
        run: |
          cat problems.md
          open=$(gh issue list --state open --label visual-qa --json number --jq length)
          recent=$(gh issue list --state all --label visual-qa --search "created:>=$(date -u -d '7 days ago' +%F)" --json number --jq length)
          if [ "$open" != "0" ] || [ "$recent" -ge 3 ]; then echo "Not opening another issue (open=$open, this week=$recent)"; exit 0; fi
          {
            echo "## Goal"; echo "Fix the problems found when the app ran on a cloud Android emulator."; echo
            echo "## Acceptance criteria"; cat problems.md
            echo "- [ ] Tests added or updated and passing; lint clean"; echo
            echo "Screenshots: artifact **screenshots** of $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > body.md
          gh issue create --title "Visual QA: fix problems found on the emulator" --body-file body.md --label ready --label visual-qa
          gh workflow run claude-agent.yml
      - name: AI design review
        if: github.event_name == 'schedule' || inputs.review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          allowed_bots: "github-actions"
          prompt: |
            You are a senior Android product designer. Screenshots of the app on a Pixel 7 emulator are in ./shots
            (light, dark, and after random input). The design brief is in the issues titled "Modern redesign"
            (gh issue list --state all --search "Modern redesign in:title", then gh issue view N).
            Look at every screenshot. If there are concrete visual defects or clear gaps against the brief
            (clipped or overlapping text, poor contrast, default-looking components, misalignment, empty areas,
            missing dark-mode styling), open ONE issue:
            Save each body with the Write tool to .issue-body.md, then run the single-line command (multi-line Bash commands are blocked):
            gh issue create --label ready --label design-review --title "Design review fixes" --body-file .issue-body.md
            (body: the goal, then up to 6 specific checkbox fixes)
            Do nothing if an open issue labelled design-review already exists or the design is polished.
            Do not change any code. Do not add the INTERNET permission.
          claude_args: --max-turns 25 --allowedTools "Read,Write,Glob,Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh issue create:*),Bash(ls:*)"
      - name: Start the agent if work was queued
        if: always() && (github.event_name == 'schedule' || inputs.review)
        run: |
          sleep 15  # the issue list can lag right after creation; the agent exits fast if nothing is queued
          gh workflow run claude-agent.yml
